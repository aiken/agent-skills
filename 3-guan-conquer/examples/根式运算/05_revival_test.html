<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复活检测</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: #fff;
            border-radius: 14px;
            padding: 40px 30px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .back {
            display: inline-block;
            background: #2196f3;
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📄</div>
        <h1>复活检测在 PDF 中</h1>
        <p>7 天后的检测内容已单独制作成 PDF 文件，由家长打印给孩子作答。</p>
        <a href="index.html" class="back">返回学习首页</a>
    </div>
</body>
</html>
